<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agendamento App</title>
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="apple-touch-icon" href="img/logo.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#E67E22" />

  <!-- TailwindCSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/app-premium.css?v=20261026-1" rel="stylesheet">

  <!-- FullCalendar -->
 
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

  <!-- Estilos extras -->
  <style>
    :root {
      --brand-primary: #1f3b64;
      --brand-primary-soft: #2b4f86;
      --brand-accent: #f28c28;
      --brand-danger: #d64545;
      --brand-bg: #f3f6fb;
      --brand-card: #ffffff;
      --brand-text: #1f2937;
      --brand-muted: #6b7280;
    }

    body {
      background: radial-gradient(circle at top right, #fff6ec 0%, var(--brand-bg) 40%, #eef3fb 100%);
      color: var(--brand-text);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: linear-gradient(180deg, #ffffff 0%, #f7f9ff 100%);
      border-right: 1px solid #e5e7eb;
    }

    #page-content > .bg-white,
    form.bg-white,
    li.bg-white,
    div.bg-white.rounded,
    div.bg-white.rounded-lg {
      border: 1px solid #e9eef7;
      box-shadow: 0 8px 24px rgba(31, 59, 100, 0.08);
      border-radius: 14px;
    }

    .menu-item {
      transition: all .2s ease;
      border-radius: 10px;
    }

    .menu-item:hover {
      background: #edf3ff !important;
      color: var(--brand-primary);
      transform: translateX(2px);
    }

    h1, h2, h3 {
      color: var(--brand-primary);
      letter-spacing: .2px;
    }

    .text-gray-500, .text-gray-600, .text-gray-700 {
      color: var(--brand-muted) !important;
    }

    .bg-blue-600 {
      background-color: var(--brand-primary-soft) !important;
    }

    .bg-blue-600:hover {
      background-color: var(--brand-primary) !important;
    }

    .bg-green-600,
    .bg-yellow-500 {
      background-color: var(--brand-accent) !important;
    }

    .bg-green-600:hover,
    .bg-yellow-500:hover {
      filter: brightness(0.94);
    }

    .bg-red-600,
    .bg-red-800 {
      background-color: var(--brand-danger) !important;
    }

    button, .rounded {
      transition: all .2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }
    #chart-reps, #chart-clis {
      height: 400px !important;
      max-height: 400px !important;
    }

    /* Tooltip customizado */
    .tooltip-custom {
      position: absolute;
      background: #1f2937; /* cinza escuro */
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.4;
      white-space: nowrap;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25); /* sombra estilo Tailwind */
    }
    /* ===== AJUSTE DO CALENDÁRIO ===== */
.fc {
  width: 100% !important;
}

.fc .fc-daygrid-day-frame {
  min-height: 120px;
}

.fc-daygrid-event {
  white-space: normal !important;
  font-size: 11px;
}

.fc .fc-toolbar {
  flex-wrap: wrap;
}
  </style>
</head>
<body class="min-h-screen md:flex">
 

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full transition-transform duration-300 z-50 md:relative md:translate-x-0">
    <div class="cf-brand">
      <img src="img/logo.png" alt="Cerâmica Fortes" class="cf-brand-logo">
      <div>
        <div class="cf-brand-name">AgendaCF</div>
        <div class="cf-brand-subtitle">Gestão Comercial</div>
      </div>
    </div>

    <nav class="cf-nav">
      <div class="cf-nav-group">
        <div class="cf-nav-label">Principal</div>
        <ul>
          <li data-perfil="all"><button data-page="dashboard" class="menu-item"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></button></li>
          <li data-perfil="all"><button data-page="notificacoes" class="menu-item"><i data-lucide="bell"></i><span>Notificações</span><span id="badge-notificacoes" class="hidden text-white text-xs px-2 py-0.5 rounded-full"></span></button></li>
        </ul>
      </div>

      <div class="cf-nav-group">
        <div class="cf-nav-label">Comercial</div>
        <ul>
          <li data-perfil="all"><button data-page="clientes" class="menu-item"><i data-lucide="users"></i><span>Clientes</span></button></li>
          <li data-perfil="all"><button data-page="pedidos" class="menu-item"><i data-lucide="package-check"></i><span>Pedidos</span></button></li>
          <li data-perfil="all"><button data-page="orcamentos" class="menu-item"><i data-lucide="file-text"></i><span>Orçamentos</span></button></li>
          <li data-perfil="admin"><button data-page="produtos" class="menu-item"><i data-lucide="tags"></i><span>Produtos</span></button></li>
        </ul>
      </div>

      <div class="cf-nav-group">
        <div class="cf-nav-label">Financeiro</div>
        <ul>
          <li data-perfil="all"><button data-page="relatorios" class="menu-item"><i data-lucide="chart-no-axes-combined"></i><span>Vendas e Comissões</span></button></li>
          <li data-perfil="admin"><button data-page="ranking-clientes" class="menu-item"><i data-lucide="trophy"></i><span>Ranking de Clientes</span></button></li>
          <li data-perfil="admin"><button data-page="recibo" class="menu-item"><i data-lucide="receipt-text"></i><span>Recibos</span></button></li>
        </ul>
      </div>

      <div class="cf-nav-group">
        <div class="cf-nav-label">Operacional</div>
        <ul>
          <li data-perfil="admin"><button data-page="producao" class="menu-item"><i data-lucide="factory"></i><span>Produção</span></button></li>
          <li data-perfil="admin"><button data-page="containers" class="menu-item"><i data-lucide="container"></i><span>Contêineres</span></button></li>
        </ul>
      </div>

      <div class="cf-nav-group">
        <div class="cf-nav-label">Administração</div>
        <ul>
          <li data-perfil="admin"><button data-page="ficha-atendimento" class="menu-item"><i data-lucide="clipboard-pen-line"></i><span>Ficha de Atendimento</span></button></li>
          <li data-perfil="admin"><button data-page="usuarios" class="menu-item"><i data-lucide="user-cog"></i><span>Usuários</span></button></li>
          <li data-perfil="admin"><button data-page="notas" class="menu-item"><i data-lucide="notebook-pen"></i><span>Bloco de Anotações</span></button></li>
        </ul>
      </div>
    </nav>

    <div class="cf-sidebar-footer">
      <button id="logout-button"><i data-lucide="log-out" class="inline-block w-4 h-4 mr-2"></i>Sair</button>
    </div>
  </aside>

  <main class="flex-1">
    <header class="cf-topbar">
      <button onclick="toggleMenu()" class="cf-mobile-menu"><i data-lucide="menu"></i><span>Menu</span></button>
      <div class="hidden md:block text-xs font-semibold uppercase tracking-widest text-gray-500">Painel de gestão</div>
      <div id="usuario-logado" class="cf-user">Carregando usuário...</div>
    </header>

    <div id="dashboard-header">
      <h1>Dashboard</h1>
      <p>Visão geral da operação comercial.</p>
    </div>

    <div id="page-content" class="space-y-4">
      <div class="bg-white cf-empty-welcome">
        <h3 class="text-lg font-semibold mb-2">Bem-vindo ao AgendaCF</h3>
        <p class="text-gray-500">Selecione uma opção no menu para começar.</p>
      </div>
    </div>
  </main>

  <!-- Firebase (compat v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-functions.js"></script>

  <!-- Extras -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="js/notas.js"></script>


  <!-- Seus scripts -->
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notificacoes.js"></script>
  <script src="js/crud.js?v=20261023-20"></script>
  <script src="js/relatorio-diario-valores.js?v=20261008-10"></script>
  <script src="js/ficha-atendimento.js?v=20261016-6"></script>
  <script src="js/precos-clientes.js?v=20260625-1"></script>
  <script src="js/precos-prazo-pedidos.js?v=20260801-6"></script>
  <script src="js/relatorio-comissoes.js?v=20260801-10"></script>
  <script src="js/agendamento-modal-fechar.js"></script>
  <script src="js/pedidos-filtros.js?v=20261017-10"></script>
  <script src="js/pedidos.js?v=20261008-10"></script>
  <script src="js/orcamentos.js?v=20261023-2"></script>
  <script src="js/ranking-cancelamentos.js?v=20260709-5"></script>
  <script src="js/producao.js?v=20260814-2"></script>
  <script src="js/containers-v2.js?v=20261021-8"></script>
  <script src="js/recibo.js"></script>
  <script src="js/ui-premium.js?v=20261026-1"></script>
  <script>function toggleMenu() {const menu = document.getElementById("sidebar");menu.classList.toggle("-translate-x-full");}</script>
  <script>
(async () => {
  await waitForAuth();
  const carregarUsuarioFn = window.carregarUsuario;
  if (typeof carregarUsuarioFn === "function") {
    await carregarUsuarioFn(); // 🔥 GARANTE PERFIL
  } else {
    console.error("Função carregarUsuario não está disponível.");
  }

  iniciarNotificacoes();

  const user = auth.currentUser;
atualizarBadge(user.uid);
})();
</script>
    
</body>
</html>
