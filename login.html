<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Agendamento App</title>
   <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="apple-touch-icon" href="img/logo.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#E67E22" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">\n  <link rel="preconnect" href="https://fonts.googleapis.com">\n  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">\n  <link href="css/app-premium.css?v=20261026-2" rel="stylesheet">
  <style>
    .login-bg {
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(17, 24, 39, 0.38), rgba(17, 24, 39, 0.38)),
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body class="cf-login-page">
  <section class="cf-login-visual">
    <div class="cf-login-copy">
      <img src="img/logo.png" alt="Logo Cerâmica Fortes">
      <h1>Gestão comercial,<br>sem complicação.</h1>
      <p>Pedidos, clientes, produção e resultados organizados em um único ambiente.</p>
      <div class="cf-login-accent"></div>
    </div>
  </section>

  <section class="cf-login-panel">
    <div class="cf-login-card">
      <div class="cf-login-eyebrow">AgendaCF</div>
      <h2>Acesse sua conta</h2>
      <p class="cf-login-description">Entre com os dados fornecidos pela empresa.</p>
      <form id="login-form">
        <label class="cf-login-field">
          <span>E-mail</span>
          <input id="login-email" type="email" autocomplete="username" placeholder="seu@email.com" required>
        </label>
        <label class="cf-login-field">
          <span>Senha</span>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
        </label>
        <button type="submit" class="cf-login-submit">Entrar no sistema</button>
      </form>
      <p class="cf-login-note">Acesso restrito a usuários autorizados.</p>
    </div>
  </section>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
